<!doctype html>
<!-- A&AP checklist: appraisalpartners.net/form/?t=<code>. It loads and saves one order through our Google Apps Script
     web app at API. No order data lives in this file; never add analytics here (the link carries the code).
     The checklist's lines are the JSON block id="checklist" below: the page and checklist_pdf.py both read it.
     Only what the law leaves to the appraiser is on it (Matt, 2026-10-10): a line marked "open" shows only while the
     order's prefill leaves it blank; what we found goes to the audit, never on the form. Comp rows are the order's
     grid_comps (first 3 by default). Questions added after a run (formlink.py --questions) show first, answers under
     q_<id>. The order's internal note never reaches the page; public_note shows when there is one.
     Once the report is back (stage returned) the pre-report sections hide (Matt, 2026-10-11): only the order, the
     desk's answers (public_note, formlink.py --note), any post-run questions and Changes or questions show.
     A Workfile copy redraws from the backend's data when questions or the note changed since it was made.
     Once post-run questions exist the START sections hide: the form then shows only what is left to answer.
     Under the buttons: "By tapping READY you agree to the ... Terms for this order" (Matt 2026-10-11: READY is the
     agreement). house_prompts.lane "review" is a partner reviewer's form (review help, no value line). house_prompts.lane "desk" (partial and full desk) is the minimal form: DRAFT and READY, no checklist. READY needs the tapper's initials (answers.ready_by), since a shared link cannot say who tapped. house_prompts.lane picks the terms: "self-service" = the A&AP Software Terms (terms-software.html),
     anything else = the A&AP Service Terms (terms.html).
     formlink.py --html writes a one-file copy of this page with the order's data inlined (id="order") for a report's
     Workfile, where TOTAL's preview pane shows it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>A&amp;AP Checklist</title>
<link rel="icon" href="logo.png">
<style>
:root {
  --bg: #f3f5f8; --card: #fff; --ink: #1c2430; --muted: #5f6b7a; --line: #c9d2dc; --field: #fbfcfd; --navy: #0d2a46;
  --draft: #c25e00; --ready: #12803a; --change: #c81e1e; --done: #1c4fb0;
  --ok-bg: #e6f4ea; --ok-ink: #0f5a29; --warn-bg: #fff4e0; --warn-ink: #7a4300; --prefill: #eef3f8;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.wrap { max-width: 760px; margin: 0 auto; padding: 14px 12px 40px; }
header { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; }
header svg { width: 64px; height: 37.6px; flex: none; }
.brand { font-size: 22px; font-weight: 800; color: var(--navy); letter-spacing: 1px; }
.sub { color: var(--muted); font-size: 14px; }
.conn { margin-left: auto; font-size: 13px; color: var(--muted); text-align: right; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0 0 12px; }
.order { font-size: 15px; }
.order b { color: var(--navy); }
.order div { margin: 2px 0; }

/* Status: the two buttons that fit the stage (DRAFT and READY, then NEEDS CHANGE and DONE once the report is back).
   Every button is the same fixed box: one line, the check in the left padding, so it never wraps or grows. */
.status-label { font-size: 12px; font-weight: 700; letter-spacing: .8px; color: var(--muted); margin: 0 0 8px; }
.status { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.st { position: relative; height: 48px; padding: 0 24px; border-radius: 8px; border: 2.5px solid var(--c); background: #fff; color: var(--c);
      font-family: inherit; font-weight: 800; font-size: 16px; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; overflow: hidden;
      cursor: pointer; -webkit-tap-highlight-color: transparent; }
@media (max-width: 500px) { .status { grid-template-columns: minmax(0, 1fr); } }   /* a phone: one under the other */
.st[data-s="DRAFT"] { --c: var(--draft); } .st[data-s="READY"] { --c: var(--ready); }
.st[data-s="NEEDS_CHANGE"] { --c: var(--change); } .st[data-s="DONE"] { --c: var(--done); }
.st[aria-pressed="true"] { background: var(--c); color: #fff; }
.st[aria-pressed="true"]::before { content: "\2713"; position: absolute; left: 8px; top: 50%; transform: translateY(-50%); }
.st:disabled { opacity: .45; cursor: not-allowed; }
.status-help { font-size: 14px; color: var(--muted); margin: 8px 0 0; }
.terms-line { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
.terms-line a { color: var(--navy); }
.initials { font: inherit; width: 5.5em; padding: 4px 8px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--field); text-transform: uppercase; }
.banner { margin: 10px 0 0; padding: 10px 12px; border-radius: 8px; font-weight: 600; }
.banner.ok { background: var(--ok-bg); color: var(--ok-ink); }
.banner.warn { background: var(--warn-bg); color: var(--warn-ink); }
.history { font-size: 13px; color: var(--muted); margin: 8px 0 0; }

/* The checklist */
h2 { font-size: 15px; margin: 0 0 2px; color: #fff; background: var(--navy); padding: 6px 12px; border-radius: 6px; }
.note { font-size: 13px; color: var(--muted); margin: 6px 0 4px; }
.line { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 4px 0; border-bottom: 1px solid #e6eaef; }
.line:last-child { border-bottom: 0; }
.line .lbl { flex: 1; min-width: 0; }
.line .lbl .hint { color: var(--muted); font-size: 13px; }
.line input[type="checkbox"] { flex: none; width: 24px; height: 24px; margin: 0; accent-color: var(--navy); }
.line input[type="text"], .line textarea { font: inherit; border: 1.5px solid var(--line); border-radius: 6px; background: var(--field); padding: 8px 10px; min-height: 40px; }
.line input[type="text"] { flex: none; width: 200px; max-width: 48%; }
.line input.short { width: 110px; }
.line.wide { flex-direction: column; align-items: stretch; gap: 6px; }
.line.wide input[type="text"], .line.wide textarea { width: 100%; max-width: none; }
textarea { min-height: 72px; resize: vertical; line-height: 1.4; overflow: hidden; }
.comp { padding: 6px 0; border-bottom: 1px solid #e6eaef; }
.comp .id { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.comp .id .n { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 13px; display: grid; place-items: center; }
.comp .id input { flex: 1; min-height: 36px; }
.comp .rate { display: flex; align-items: center; gap: 8px; margin: 6px 0 0 32px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.comp .rate .lbl { flex: none; width: 70px; }
/* Choices: tap buttons, never a native dropdown (TOTAL's preview pane flickers on those). Tap again to clear. */
.line.choice { flex-wrap: wrap; }
.line.choice .lbl { flex: 1 1 160px; }
.taps { display: flex; flex-wrap: wrap; gap: 6px; }
.tap { min-height: 34px; padding: 4px 10px; border-radius: 7px; border: 2px solid var(--navy); background: #fff; color: var(--navy);
       font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.tap[aria-pressed="true"] { background: var(--navy); color: #fff; }
.tap[aria-pressed="true"]::before { content: "\2713\00a0"; }
.tap:disabled { opacity: .45; cursor: not-allowed; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 6px 0; }
.checks label { display: flex; align-items: center; gap: 8px; min-height: 36px; }
.checks input { width: 22px; height: 22px; margin: 0; accent-color: var(--navy); }
.changes .line .n { flex: none; width: 22px; color: var(--muted); font-weight: 600; padding-top: 9px; }
.changes .id { display: flex; gap: 8px; align-items: flex-start; }
.changes .id textarea { flex: 1; min-height: 40px; }
#order .note { white-space: pre-line; color: var(--ink); font-size: 15px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.mic { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--navy); color: #fff; display: grid; place-items: center; cursor: pointer; }
.mic.on { background: var(--change); animation: pulse 1.4s infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(200, 30, 30, .45); } 50% { box-shadow: 0 0 0 10px rgba(200, 30, 30, 0); } }
.mic svg { width: 18px; height: 24px; }
.talk-row { display: flex; gap: 10px; align-items: center; }
.talk-hint { font-size: 13px; color: var(--muted); }
.foot { text-align: center; font-size: 13px; color: var(--muted); margin: 18px 0 0; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
#gate p { margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>

      <div class="brand">A&amp;AP</div>

    <div class="conn" id="conn" aria-live="polite"></div>
  </header>

  <section class="card" id="gate" aria-live="polite"><p id="gate-msg">Loading…</p></section>

  <div id="main" hidden>
  <section class="card order" id="order" aria-label="The order"></section>

  <section class="card" aria-labelledby="st-top">

    <p class="status-help" id="help"></p>
    <div id="banner" aria-live="polite"></div>
    <div class="history" id="history"></div>
  </section>

  <fieldset id="form"><div id="sections"></div></fieldset>

  <section class="card" aria-labelledby="st-bottom">
    <p class="status-label" id="st-bottom">DONE? SET THE STATUS</p>
    <div class="status" data-status></div>
    <p class="terms-line" data-terms></p>
    <div id="banner2" aria-live="polite"></div>
  </section>
  </div>

  <p class="foot">The value is yours alone. We ask for it only once the report is built, and enter it exactly as you give it. · A&amp;AP</p>
</div>

<script type="application/json" id="checklist">

<script>
var API = "https://script.google.com/macros/s/AKfycbxyxyutBsWhDBuoghbN-ybCXooZPwO_MB0iqsrAarETBMjLEdV5GfyFd_tgh_PiEA4z_w/exec";   // the web app's /exec URL (SETUP.md); while empty, the page says it is not connected
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var STATUSES = ["DRAFT", "READY", "NEEDS_CHANGE", "DONE"];
  var LABEL = {}; STATUSES.forEach(function (s) { LABEL[s] = s.replace("_", " "); });
  // The order's stage picks the buttons: open until we send the report back, returned once it's in their folder.
  var STAGES = {
    open: { statuses: ["DRAFT", "READY"], help: "Tick what's right, pick your calls, then tap <b>READY</b>. READY means your inspection is done and your photos, sketch and files are in the Workfile. Blanks stay blank; anything we still need comes back here after the build.",
            refused: "The report isn't back with you yet. Tap READY when your checklist is done." },
    returned: { statuses: ["NEEDS_CHANGE", "DONE"], help: "Review the report in TOTAL. If it reads right, sign and deliver it as you always do, then tap <b>DONE</b>. For a change or a question, write it below and tap <b>NEEDS CHANGE</b>; our answer shows at the top of this form.",
                refused: "The report is back in your folder now. Tap NEEDS CHANGE or DONE." }
  };
  var SENT = "Saved with A&AP. We'll email you when it's back.";
  var THANKS = "Saved with A&AP. Thank you.";
  var NCHANGES = 5;
  var MAX_BODY = 100000;       // Code.gs's limit on one save
  var CHECKLIST = JSON.parse($("checklist").textContent);
  var INLINE = $("order-data") ? JSON.parse($("order-data").textContent) : null;

  var T = (INLINE && INLINE.t) || new URLSearchParams(location.search).get("t") || "";
  var D = {}, O = {}, state = null, stage = "open";
  var controls = {};      // name -> {set}
  var online = false, readOnly = false, edits = 0, savedEdits = 0, timer = null, writing = Promise.resolve();
  var connecting = false, tapped = null;   // a status tapped while the first read is under way goes out once it connects
  var savedAt = null;          // the stored answers' updatedAt, as last read

  // ---------- small DOM helpers ----------
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "cls") n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function changed() { edits++; afterEdit(); }
  function grow(t) {
    if (t.tagName !== "TEXTAREA" || !t.isConnected) return;
    t.style.height = "auto"; t.style.height = (t.scrollHeight + 3) + "px";
  }
  window.addEventListener("resize", function () { document.querySelectorAll("textarea").forEach(grow); });

  // ---------- one line each (names match the PDF's fields) ----------
  function check(name, label, cls, href) {
    var input = el("input", { type: "checkbox" });
    input.addEventListener("change", function () { state.answers[name] = input.checked; changed(); });
    controls[name] = { set: function (v) { input.checked = !!v; } };
    var lbl = el("span", { cls: "lbl", text: label + (href ? " " : "") });
    if (href) lbl.appendChild(el("a", { href: href, target: "_blank", rel: "noopener", text: "Read the terms" }));
    return el("label", { cls: "line " + (cls || "") }, [input, lbl]);
  }
  function text(name, label, opts) {
    opts = opts || {};
    var id = "f-" + name;
    var input = opts.multi ? el("textarea", { id: id, rows: "3" }) : el("input", { id: id, type: "text", autocomplete: "off" });
    if (opts.short) input.className = "short";
    input.addEventListener("input", function () { state.answers[name] = input.value; grow(input); changed(); });
    controls[name] = { set: function (v) { v = v == null ? "" : String(v); if (input.value !== v) input.value = v; grow(input); } };
    var row = el("div", { cls: "line" + (opts.multi || opts.wide ? " wide" : "") }, [el("label", { cls: "lbl", "for": id, text: label }), input]);
    if (opts.talk) row.appendChild(talkRow(input));
    return row;
  }
  function taps(name, label, options) {
    var box = el("div", { cls: "taps", role: "group", "aria-label": label }), btns = [];
    function paint(v) { btns.forEach(function (b) { b.setAttribute("aria-pressed", String(b.value === v)); }); }
    options.forEach(function (o) {
      var b = el("button", { type: "button", cls: "tap", value: o, "aria-pressed": "false", text: o });
      b.addEventListener("click", function () {
        state.answers[name] = state.answers[name] === o ? "" : o;     // tap again to clear
        paint(state.answers[name]); changed();
      });
      btns.push(b); box.appendChild(b);
    });
    controls[name] = { set: function (v) { paint(v == null ? "" : String(v)); } };
    return box;

      if (tapped) setStatus(tapped);   // shows the tap as chosen with the not-connected line
      if (e && e.code === "unknown") setReadOnly("This copy's link no longer works. Reply to our email and we'll send a fresh one.");
    });
    return;
  }
  if (!T) { gate("This page needs the link from our email. Open the checklist from that link."); return; }
  if (!API) { gate("The checklist isn't connected yet. Reply to our email and we'll sort it out."); return; }
  read().then(function (r) { online = true; conn("Connected"); boot(r.form, r.saved); }, function (e) {
    gate(e && e.code === "unknown" ? "This link isn't working. Reply to our email and we'll send a fresh one."
                                   : "We couldn't open your checklist just now. Check your connection and try again.");
  });
})();
</script>
